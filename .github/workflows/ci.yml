# Go gate matrix: stable + previous, tip as experimental allowed-fail leg,
# race detector, govulncheck, corpus fuzz on PR. Monthly bitrot cron.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # merge_group: GitHub merge queues validate a grouped future state of main;
  # without this trigger the queue would wait forever for checks that never
  # report (research note 39). No-op until the owner enables the queue.
  merge_group:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Loop 32: the shared Go kit replaces the inline test/lint/vuln jobs. Its
  # commands are byte-identical to scripts/test.sh, scripts/lint.sh and
  # scripts/vuln.sh (verified line by line), plus a `go build` gate the
  # inline jobs lacked. The scripts stay canonical for local use -- `make
  # test` runs the same commands CI runs.
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/go-kit.yml@a88b4c7fb4a62616d86fb1c39130896e90642e4e
    with:
      go-version: stable
      lint: true
      race: true
      vuln: true



  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: go test -fuzz="FuzzDistance" -fuzztime=30s ./internal/geometry

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check-contract.sh

  # Loop 1: macOS + Windows legs — the shared gate runs on Linux; these
  # prove the build+test surface on the other platforms (advisory while
  # platform-specific findings are triaged).
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...

  # Loop 2: performance budget - blocking since it stayed green for a full
  # loop (LOOP.md graduation policy). Same scripts/ command a developer runs
  # locally; never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: make bench

  # Loop 3: determinism verification - blocking since it stayed green for a
  # full loop, and since measurement showed every toolchain in the estate is
  # byte-reproducible (ADR: determinism verification). Same scripts/ command a
  # developer runs locally.
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
      - run: make repro

  # Phase 1 of copier adoption (ADR-0001, engineering-standards): copying this
  # template with default answers must reproduce the tracked content exactly.
  # Any drift is a template bug — the update channel depends on this invariant.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install copier
      - name: byte-identical scaffold check
        run: |
          mkdir -p "$RUNNER_TEMP/tracked"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked" -f -
          copier copy --defaults "$RUNNER_TEMP/tracked" "$RUNNER_TEMP/sc"
          diff -r --exclude=.copier-answers.yml --exclude=.copier-answers.yml.jinja --exclude=.git --exclude=copier.yml \
            "$RUNNER_TEMP/sc" "$RUNNER_TEMP/tracked"
