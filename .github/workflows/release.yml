# goreleaser on tag: multiplatform builds, checksums, SBOM, attestation,
# optional homebrew tap (.goreleaser.yaml). Requires GITHUB_TOKEN only.
name: release

on:
  push:
    tags: ["v*"]


jobs:
  goreleaser:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'WyattAu' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          # audit mode: egress is logged, not blocked -- evidence first,
          # enforcement after review (OMNI-CORE 11j, research note 42).
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # cache: false -- a tag-triggered publish must not write or read runtime
      # caches; caches outlive the run and can be poisoned by an earlier one
      # (zizmor cache-poisoning, found live in loop 30).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # SBOM of the dependency graph ships with the release (research note 40).
      - name: generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
